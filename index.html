<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeLingo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #131F24;
            color: white;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- ONBOARDING (SPRACHAUSWAHL) --- */
        #onboarding {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            text-align: center;
        }
        
        #onboarding h1 {
            font-size: 28px;
            margin-top: 40px;
            margin-bottom: 10px;
        }
        
        #onboarding p {
            color: #AFAFAF;
            margin-bottom: 30px;
        }

        .course-card {
            background-color: #202F36;
            border: 2px solid #3C4B53;
            border-bottom: 6px solid #3C4B53;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
        }

        .course-card:active {
            transform: translateY(4px);
            border-bottom: 2px solid #3C4B53;
        }

        .course-card .flag {
            font-size: 40px;
            margin-right: 20px;
        }

        .course-card .title {
            font-size: 20px;
            font-weight: 800;
        }

        /* --- HAUPT-APP --- */
        #main-app {
            display: none; /* Wird per JS eingeblendet */
            flex-direction: column;
            height: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 800;
            z-index: 10;
            background-color: #131F24;
            border-bottom: 2px solid #202F36;
        }

        .stat { display: flex; align-items: center; gap: 5px; }
        .stat.streak { color: #FF9600; }
        .stat.gems { color: #1CB0F6; }
        .stat.hearts { color: #FF4B4B; }

        /* Der Kurs-Wechsel-Button */
        .course-switcher-btn {
            background-color: #202F36;
            border: 2px solid #3C4B53;
            color: white;
            padding: 5px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Der scrollbare Lernpfad */
        .path-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Die Überschriften der Stufen */
        .unit-header {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            margin: 20px 0 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        .unit-header h2 { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #131F24; }
        .unit-header p { font-size: 14px; font-weight: 700; color: #131F24; margin-top: 4px; }

        /* Farben für die verschiedenen Stufen */
        .bg-green { background-color: #58CC02; }
        .bg-purple { background-color: #CE82FF; }
        .bg-blue { background-color: #1CB0F6; }
        .bg-orange { background-color: #FF9600; }

        /* Die Kreise im Pfad */
        .node-wrapper {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Geschwungener Pfad */
        .node-wrapper:nth-child(4n+1) { transform: translateX(0px); }
        .node-wrapper:nth-child(4n+2) { transform: translateX(50px); }
        .node-wrapper:nth-child(4n+3) { transform: translateX(-50px); }
        .node-wrapper:nth-child(4n+4) { transform: translateX(0px); }

        .node {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #58CC02;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 0 #46A302;
            transition: all 0.1s;
            position: relative;
            z-index: 2;
        }

        .node:active { transform: translateY(4px); box-shadow: 0 2px 0 #46A302; }

        .node.locked {
            background-color: #3C4B53;
            box-shadow: 0 6px 0 #2A353B;
            color: #6E7B82;
        }

        /* Der Tooltip für den aktiven Level */
        .tooltip {
            position: absolute;
            top: -45px;
            background-color: #131F24;
            color: #58CC02;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            border: 2px solid #3C4B53;
            z-index: 3;
        }
        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid;
            border-color: #3C4B53 transparent transparent transparent;
        }

        /* Navigationsleiste unten */
        .bottom-nav {
            position: absolute;
            bottom: 0; width: 100%;
            background-color: #131F24;
            border-top: 2px solid #202F36;
            display: flex;
            justify-content: space-around;
            padding: 15px 0; z-index: 10;
        }
        .nav-item { color: #52656D; font-size: 28px; padding: 5px 15px; border-radius: 10px; cursor: pointer; }
        .nav-item.active { color: #1CB0F6; background-color: rgba(28, 176, 246, 0.15); }

        /* Quiz Modal (Vollbild) */
        #quiz-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24; z-index: 50; padding: 20px; flex-direction: column;
        }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .close-btn { background: none; border: none; color: #52656D; font-size: 24px; cursor: pointer; }
        .quiz-question { font-size: 22px; font-weight: 800; margin-bottom: 30px; }
        .quiz-options { display: flex; flex-direction: column; gap: 15px; }
        .option-btn {
            background-color: #131F24; border: 2px solid #3C4B53; border-bottom: 4px solid #3C4B53;
            color: white; padding: 15px; border-radius: 15px; font-size: 18px; font-weight: 700;
            text-align: left; cursor: pointer;
        }
        .option-btn.correct { background-color: rgba(88, 204, 2, 0.2); border-color: #58CC02; color: #58CC02; }
        .option-btn.wrong { background-color: rgba(255, 75, 75, 0.2); border-color: #FF4B4B; color: #FF4B4B; }
    </style>
</head>
<body>

    <!-- 1. DER START-BILDSCHIRM (Onboarding) -->
    <div id="onboarding">
        <h1>Was möchtest du lernen?</h1>
        <p>Du kannst später jederzeit wechseln.</p>
        
        <div class="course-card" onclick="startCourse('spanisch')">
            <div class="flag">🇪🇸</div>
            <div class="title">Spanisch</div>
        </div>
        <div class="course-card" onclick="startCourse('lua')">
            <div class="flag">🌙</div>
            <div class="title">Lua Programmierung</div>
        </div>
        <div class="course-card" onclick="startCourse('python')">
            <div class="flag">🐍</div>
            <div class="title">Python</div>
        </div>
    </div>

    <!-- 2. DIE HAUPT-APP -->
    <div class="app-container" id="main-app">
        
        <!-- Obere Leiste mit Kurs-Wechsler -->
        <div class="top-bar">
            <button class="course-switcher-btn" onclick="openCourseSwitcher()">
                <span id="current-course-flag">🇪🇸</span>
                <span>Wechseln</span>
            </button>
            <div class="stat streak">🔥 <span id="streak-val">4</span></div>
            <div class="stat gems">💎 <span id="gems-val">717</span></div>
        </div>

        <!-- Scrollbarer Lernpfad -->
        <div class="path-container" id="path-container">
            <!-- Wird dynamisch per JavaScript generiert -->
        </div>

        <!-- Untere Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">🏠</div>
            <div class="nav-item">🏋️</div>
            <div class="nav-item">🛡️</div>
            <div class="nav-item">🎁</div>
            <div class="nav-item">👤</div>
        </div>

        <!-- Quiz Modal -->
        <div id="quiz-modal">
            <div class="quiz-header">
                <button class="close-btn" onclick="closeQuiz()">✖</button>
                <div style="color: #58CC02; font-weight: 900; font-size: 20px;">❤️ ❤️ ❤️ ❤️ ❤️</div>
                <div style="width: 24px;"></div>
            </div>
            <div class="quiz-question" id="quiz-question-text">Frage lädt...</div>
            <div class="quiz-options" id="quiz-options-container">
                <!-- Antworten werden per JS geladen -->
            </div>
        </div>
    </div>

    <script>
        // --- DATEN & STATUS ---
        const courseData = {
            'spanisch': { flag: '🇪🇸', name: 'Spanisch', color: '#58CC02', questions: [
                { q: 'Wie sagt man "Hallo" auf Spanisch?', a: ['Hola', 'Ciao', 'Hello'], correct: 0 },
                { q: 'Was bedeutet "Gracias"?', a: ['Bitte', 'Danke', 'Tschüss'], correct: 1 }
            ]},
            'lua': { flag: '🌙', name: 'Lua', color: '#1CB0F6', questions: [
                { q: 'Wie gibt man Text in Lua aus?', a: ['console.log()', 'print()', 'echo'], correct: 1 },
                { q: 'Wie lautet das Kommentarzeichen in Lua?', a: ['//', '<!--', '--'], correct: 2 }
            ]},
            'python': { flag: '🐍', name: 'Python', color: '#FF9600', questions: [
                { q: 'Wie gibt man Text in Python aus?', a: ['print()', 'console.log()', 'System.out'], correct: 0 },
                { q: 'Wie definiert man eine Funktion?', a: ['function test()', 'def test():', 'void test()'], correct: 1 }
            ]}
        };

        let activeCourse = null;
        // Lade Fortschritt aus dem Speicher (falls vorhanden), sonst starte bei 0
        let progress = JSON.parse(localStorage.getItem('lingoProgress')) || {
            'spanisch': 0,
            'lua': 0,
            'python': 0
        };

        // --- FUNKTIONEN ---

        // Wird beim Klick auf einen Kurs im Startbildschirm ausgeführt
        function startCourse(courseId) {
            activeCourse = courseId;
            localStorage.setItem('activeCourse', courseId);
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            renderApp();
        }

        // Baut den Pfad basierend auf dem Fortschritt neu auf
        function renderApp() {
            document.getElementById('current-course-flag').innerText = courseData[activeCourse].flag;
            
            const container = document.getElementById('path-container');
            container.innerHTML = ''; // Alles löschen

            const currentProgress = progress[activeCourse];

            // Wir bauen 3 Stufen (Units) mit jeweils 4 Lektionen
            for (let unit = 1; unit <= 3; unit++) {
                let colorClass = unit === 1 ? 'bg-green' : (unit === 2 ? 'bg-purple' : 'bg-blue');
                
                // Header für die Stufe
                let headerHTML = `
                    <div class="unit-header ${colorClass}">
                        <div>
                            <h2>Stufe 1, Abschnitt ${unit}</h2>
                            <p>Lerne die Grundlagen</p>
                        </div>
                        <div style="font-size: 24px;">📖</div>
                    </div>
                `;
                container.innerHTML += headerHTML;

                // 4 Lektionen pro Stufe
                for (let lesson = 1; lesson <= 4; lesson++) {
                    let nodeIndex = (unit - 1) * 4 + lesson; // Berechnet den absoluten Index (1 bis 12)
                    let isCompleted = nodeIndex <= currentProgress;
                    let isActive = nodeIndex === currentProgress + 1;

                    let nodeClass = isCompleted ? '' : (isActive ? '' : 'locked');
                    let nodeIcon = isCompleted ? '⭐' : (isActive ? '📖' : '🔒');
                    let tooltipHTML = isActive ? `<div class="tooltip">HIERHIN SPRINGEN?</div>` : '';

                    // Wenn es die aktive Lektion ist, fügen wir das Klick-Event hinzu
                    let onClick = isActive ? `onclick="openQuiz(${nodeIndex})"` : '';

                    let nodeHTML = `
                        <div class="node-wrapper">
                            ${tooltipHTML}
                            <button class="node ${nodeClass}" ${onClick}>
                                ${nodeIcon}
                            </button>
                        </div>
                    `;
                    container.innerHTML += nodeHTML;
                }
            }

            // Ganz unten noch ein "Abgeschlossen"-Schild simulieren
            container.innerHTML += `<div style="margin-top: 30px; color: #52656D; font-weight: 800; font-size: 20px;">🏆 Stufe 2 (Gesperrt)</div>`;
        }

        // --- QUIZ LOGIK ---
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let currentTargetNode = 0;

        function openQuiz(nodeIndex) {
            currentTargetNode = nodeIndex;
            currentQuestions = courseData[activeCourse].questions;
            currentQuestionIndex = 0;
            
            document.getElementById('quiz-modal').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                // Alle Fragen beantwortet -> Lektion abschließen
                completeLesson();
                return;
            }

            let qData = currentQuestions[currentQuestionIndex];
            document.getElementById('quiz-question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            qData.a.forEach((optionText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, index === qData.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1000);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => {
                    // Zurücksetzen, wenn falsch (man muss es nochmal probieren)
                    allBtns.forEach(b => {
                        b.classList.remove('wrong');
                        b.disabled = false;
                    });
                }, 1000);
            }
        }

        function completeLesson() {
            closeQuiz();
            // Fortschritt speichern
            progress[activeCourse] = currentTargetNode;
            localStorage.setItem('lingoProgress', JSON.stringify(progress));
            
            // Pfad neu zeichnen (nächster Node wird aktiv)
            renderApp();
            
            // Ein bisschen nach unten scrollen, damit man den neuen Node sieht
            setTimeout(() => {
                const activeNode = document.querySelector('.tooltip');
                if(activeNode) {
                    activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').style.display = 'none';
            // Buttons wieder aktivieren für das nächste Mal
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
        }

        // --- KURS-WECHSEL ---
        function openCourseSwitcher() {
            // Ganz einfacher Wechsel: Wir zeigen einfach das Onboarding-Menü wieder an, aber ohne die Seite neu zu laden
            document.getElementById('onboarding').style.display = 'flex';
        }

        // --- INITIALISIERUNG BEIM LADEN ---
        window.onload = function() {
            let savedCourse = localStorage.getItem('activeCourse');
            if (savedCourse && courseData[savedCourse]) {
                // Wenn schon ein Kurs gewählt wurde, direkt reinspringen
                activeCourse = savedCourse;
                document.getElementById('onboarding').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                renderApp();
            } else {
                // Ansonsten Onboarding zeigen
                document.getElementById('onboarding').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        }
    </script>
</body>
</html>
