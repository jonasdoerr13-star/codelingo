<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeLingo</title>
    <style>
        /* Google Fonts für den echten Duolingo-Look */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Verhindert blaues Aufblitzen auf Handys */
        }

        body {
            background-color: #131F24; /* Das dunkle Blau/Grau */
            color: white;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Simuliert ein Handy-Display auf dem PC */
        .app-container {
            width: 100%;
            max-width: 400px; /* Handybreite */
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Obere Leiste (Header) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 800;
            z-index: 10;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat.streak { color: #FF9600; }
        .stat.gems { color: #1CB0F6; }
        .stat.hearts { color: #FF4B4B; }

        /* Die Überschrift der Stufe */
        .unit-header {
            background-color: #58CC02;
            color: #131F24;
            padding: 15px 20px;
            border-radius: 15px;
            margin: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 #46A302; /* Der 3D-Effekt */
        }

        .unit-header h2 {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .unit-header p {
            font-size: 14px;
            font-weight: 700;
            margin-top: 4px;
        }

        .book-icon {
            font-size: 24px;
            color: rgba(0,0,0,0.2);
        }

        /* Der scrollbare Lernpfad */
        .path-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px 100px 20px; /* Platz unten für die Navi */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Die Kreise im Pfad */
        .node-wrapper {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Versetzt die Kreise nach links und rechts für den geschwungenen Pfad */
        .node-wrapper:nth-child(even) { transform: translateX(-40px); }
        .node-wrapper:nth-child(odd) { transform: translateX(40px); }
        .node-wrapper:nth-child(3) { transform: translateX(0px); } /* Mitte */

        .node {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #58CC02;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 #46A302, 0 8px 15px rgba(0,0,0,0.5); /* Doppelter 3D-Schatten */
            transition: all 0.1s;
            position: relative;
            z-index: 2;
        }

        .node:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #46A302;
        }

        .node.locked {
            background-color: #3C4B53;
            box-shadow: 0 8px 0 #2A353B;
            color: #6E7B82;
        }

        /* Der Tooltip "ANFANGEN" */
        .tooltip {
            position: absolute;
            top: -45px;
            background-color: white;
            color: #131F24;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #d1d5db;
            animation: bounce 1s infinite;
            z-index: 3;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Untere Navigationsleiste */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #131F24;
            border-top: 2px solid #202F36;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 10;
        }

        .nav-item {
            color: #52656D;
            font-size: 28px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 10px;
        }

        .nav-item.active {
            color: #1CB0F6;
            background-color: rgba(28, 176, 246, 0.15);
        }

        /* Quiz Modal (Versteckt) */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24;
            z-index: 20;
            padding: 20px;
            flex-direction: column;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #52656D;
            font-size: 24px;
            cursor: pointer;
        }

        .quiz-question {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #131F24;
            border: 2px solid #3C4B53;
            border-bottom: 4px solid #3C4B53;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }

        .option-btn:active {
            transform: translateY(2px);
            border-bottom: 2px solid #3C4B53;
        }

        .option-btn.correct {
            background-color: rgba(88, 204, 2, 0.2);
            border-color: #58CC02;
            color: #58CC02;
        }

        .option-btn.wrong {
            background-color: rgba(255, 75, 75, 0.2);
            border-color: #FF4B4B;
            color: #FF4B4B;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Obere Leiste -->
        <div class="top-bar">
            <div class="stat streak">🔥 5</div>
            <div class="stat gems">💎 2036</div>
            <div class="stat hearts">❤️ 5</div>
        </div>

        <!-- Stufen-Header -->
        <div class="unit-header">
            <div>
                <h2>Stufe 1, Abschnitt 1</h2>
                <p>Bestelle im Café (Lua)</p>
            </div>
            <div class="book-icon">📖</div>
        </div>

        <!-- Lernpfad -->
        <div class="path-container">
            
            <div class="node-wrapper">
                <button class="node">⭐</button>
            </div>

            <div class="node-wrapper">
                <div class="tooltip">Anfangen</div>
                <button class="node" onclick="openQuiz()">📖</button>
            </div>

            <div class="node-wrapper">
                <button class="node locked">🔒</button>
            </div>

            <div class="node-wrapper">
                <button class="node locked">🔒</button>
            </div>

            <div class="node-wrapper">
                <button class="node locked">📦</button>
            </div>

        </div>

        <!-- Untere Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">🏠</div>
            <div class="nav-item">🏋️</div>
            <div class="nav-item">🛡️</div>
            <div class="nav-item">🎁</div>
            <div class="nav-item">👤</div>
        </div>

        <!-- Quiz Modal -->
        <div id="quiz-modal">
            <div class="quiz-header">
                <button class="close-btn" onclick="closeQuiz()">✖</button>
                <div style="color: #58CC02; font-weight: 900; font-size: 20px;">❤️ ❤️ ❤️ ❤️ ❤️</div>
                <div style="width: 24px;"></div> <!-- Platzhalter für Symmetrie -->
            </div>

            <div class="quiz-question">Wie gibt man einen Text in Lua aus?</div>

            <div class="quiz-options">
                <button class="option-btn" onclick="checkAnswer(this, false)">console.log("Hallo")</button>
                <button class="option-btn" onclick="checkAnswer(this, true)">print("Hallo")</button>
                <button class="option-btn" onclick="checkAnswer(this, false)">echo "Hallo"</button>
            </div>
        </div>
    </div>

    <script>
        // Öffnet das Quiz
        function openQuiz() {
            document.getElementById('quiz-modal').style.display = 'flex';
        }

        // Schließt das Quiz
        function closeQuiz() {
            document.getElementById('quiz-modal').style.display = 'none';
        }

        // Prüft die Antwort
        function checkAnswer(button, isCorrect) {
            // Alle Buttons zurücksetzen
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = true; // Verhindert mehrfaches Klicken
            });

            if (isCorrect) {
                button.classList.add('correct');
                // Nach 1 Sekunde das Quiz schließen und den Pfad updaten
                setTimeout(() => {
                    closeQuiz();
                    
                    // Den zweiten Knoten (die Buch-Lektion) auf "Erledigt" setzen
                    const nodes = document.querySelectorAll('.node');
                    nodes[1].innerHTML = '⭐'; // Buch wird zum Stern
                    nodes[1].style.backgroundColor = '#58CC02';
                    
                    // Den dritten Knoten freischalten
                    nodes[2].classList.remove('locked');
                    nodes[2].innerHTML = '⭐';

                    // Tooltip entfernen
                    const tooltip = document.querySelector('.tooltip');
                    if(tooltip) tooltip.remove();

                    // Buttons wieder aktivieren für später
                    buttons.forEach(btn => {
                        btn.classList.remove('correct', 'wrong');
                        btn.disabled = false;
                    });

                }, 1000);
            } else {
                button.classList.add('wrong');
                // Nach 1,5 Sekunden alles zurücksetzen, damit mans nochmal probieren kann
                setTimeout(() => {
                    buttons.forEach(btn => {
                        btn.classList.remove('correct', 'wrong');
                        btn.disabled = false;
                    });
                }, 1500);
            }
        }
    </script>
</body>
</html>
