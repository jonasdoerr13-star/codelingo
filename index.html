<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeLingo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #131F24; color: white;
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 400px; height: 100vh;
            display: flex; flex-direction: column; position: relative;
        }

        /* --- ONBOARDING (Name & Sprache) --- */
        #onboarding {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24; z-index: 100;
            display: flex; flex-direction: column; padding: 30px 20px; text-align: center;
            overflow-y: auto;
        }
        
        #onboarding h1 { font-size: 26px; margin-top: 20px; margin-bottom: 10px; }
        #onboarding p { color: #AFAFAF; margin-bottom: 20px; }
        
        input[type="text"] {
            width: 100%; padding: 15px; background-color: #202F36;
            border: 2px solid #3C4B53; border-radius: 12px; color: white;
            font-size: 18px; font-weight: bold; margin-bottom: 20px; outline: none;
        }
        input[type="text"]:focus { border-color: #1CB0F6; }

        .course-card {
            background-color: #202F36; border: 2px solid #3C4B53; border-bottom: 6px solid #3C4B53;
            border-radius: 15px; padding: 15px 20px; margin-bottom: 12px;
            display: flex; align-items: center; cursor: pointer; transition: 0.1s;
        }
        .course-card:active { transform: translateY(4px); border-bottom: 2px solid #3C4B53; }
        .course-card .flag { font-size: 35px; margin-right: 20px; }
        .course-card .title { font-size: 18px; font-weight: 800; }

        /* --- HAUPT-APP --- */
        #main-app { display: none; flex-direction: column; height: 100%; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; font-size: 18px; font-weight: 800;
            z-index: 10; background-color: #131F24; border-bottom: 2px solid #202F36;
        }
        .stat { display: flex; align-items: center; gap: 5px; }
        .stat.streak { color: #FF9600; }
        .stat.gems { color: #1CB0F6; }
        
        .course-switcher-btn {
            background-color: #202F36; border: 2px solid #3C4B53; color: white;
            padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        /* Der scrollbare Inhalt */
        .content-area {
            flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px;
            display: flex; flex-direction: column;
        }

        /* Ansichten (Pfad, Freunde, Profil) */
        .view { display: none; flex-direction: column; height: 100%; }
        .view.active { display: flex; }

        /* --- LERN-PFAD --- */
        .path-container { display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .unit-header {
            width: 100%; padding: 15px 20px; border-radius: 15px; margin: 10px 0 30px 0;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); background-color: #58CC02; color: #131F24;
        }
        .unit-header h2 { font-size: 14px; font-weight: 900; text-transform: uppercase; }
        .unit-header p { font-size: 16px; font-weight: 800; margin-top: 4px; }

        .node-wrapper { position: relative; margin-bottom: 20px; display: flex; justify-content: center; width: 100%; }
        .node-wrapper:nth-child(4n+1) { transform: translateX(0px); }
        .node-wrapper:nth-child(4n+2) { transform: translateX(40px); }
        .node-wrapper:nth-child(4n+3) { transform: translateX(-40px); }
        .node-wrapper:nth-child(4n+4) { transform: translateX(0px); }

        .node {
            width: 65px; height: 65px; border-radius: 50%; background-color: #58CC02;
            border: none; display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 6px 0 #46A302;
            transition: all 0.1s; position: relative; z-index: 2; color: white;
        }
        .node:active { transform: translateY(4px); box-shadow: 0 2px 0 #46A302; }
        .node.locked { background-color: #3C4B53; box-shadow: 0 6px 0 #2A353B; color: #6E7B82; }

        .tooltip {
            position: absolute; top: -40px; background-color: #131F24; color: #58CC02;
            padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 12px;
            border: 2px solid #3C4B53; z-index: 3;
        }

        /* --- SOCIAL / FREUNDE ANSICHT --- */
        .friends-header { margin-bottom: 20px; }
        .friends-header h2 { font-size: 24px; margin-bottom: 5px; }
        .friends-header p { color: #AFAFAF; font-size: 14px; }

        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #202F36; padding: 15px; border-radius: 15px;
            margin-bottom: 15px; border: 2px solid #3C4B53;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 50px; height: 50px; border-radius: 50%; background-color: #1CB0F6;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
        }
        .user-name { font-weight: 800; font-size: 16px; }
        .user-xp { color: #FF9600; font-size: 12px; font-weight: 700; }

        .add-btn {
            background-color: #1CB0F6; color: white; border: none; border-bottom: 4px solid #1899D6;
            padding: 8px 15px; border-radius: 10px; font-weight: 800; cursor: pointer;
            transition: 0.1s; font-size: 14px;
        }
        .add-btn:active { transform: translateY(4px); border-bottom: none; }
        .add-btn.added { background-color: #52656D; border-bottom: 4px solid #3C4B53; color: #AFAFAF; }

        /* --- PROFIL ANSICHT --- */
        .profile-card {
            display: flex; flex-direction: column; align-items: center;
            background-color: #202F36; padding: 30px 20px; border-radius: 20px;
            border: 2px solid #3C4B53; margin-bottom: 20px;
        }
        .profile-avatar {
            width: 100px; height: 100px; border-radius: 50%; background-color: #CE82FF;
            display: flex; justify-content: center; align-items: center; font-size: 50px;
            margin-bottom: 15px; border: 4px solid #131F24;
        }
        .profile-name { font-size: 24px; font-weight: 900; }
        .profile-stats { display: flex; gap: 20px; margin-top: 15px; width: 100%; }
        .p-stat { flex: 1; text-align: center; background: #131F24; padding: 10px; border-radius: 10px; }
        .p-stat span { display: block; font-size: 20px; font-weight: 900; color: #FF9600; }
        .p-stat label { font-size: 12px; color: #AFAFAF; font-weight: bold; }

        /* --- NAVIGATION --- */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; background-color: #131F24;
            border-top: 2px solid #202F36; display: flex; justify-content: space-around;
            padding: 15px 0; z-index: 10;
        }
        .nav-item { color: #52656D; font-size: 24px; padding: 5px 15px; border-radius: 10px; cursor: pointer; }
        .nav-item.active { color: #1CB0F6; background-color: rgba(28, 176, 246, 0.15); }

        /* Quiz Modal */
        #quiz-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #131F24; z-index: 50; padding: 20px; flex-direction: column;
        }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .close-btn { background: none; border: none; color: #52656D; font-size: 24px; cursor: pointer; }
        .quiz-question { font-size: 22px; font-weight: 800; margin-bottom: 30px; }
        .quiz-options { display: flex; flex-direction: column; gap: 15px; }
        .option-btn {
            background-color: #131F24; border: 2px solid #3C4B53; border-bottom: 4px solid #3C4B53;
            color: white; padding: 15px; border-radius: 15px; font-size: 18px; font-weight: 700;
            text-align: left; cursor: pointer;
        }
        .option-btn.correct { background-color: rgba(88, 204, 2, 0.2); border-color: #58CC02; color: #58CC02; }
        .option-btn.wrong { background-color: rgba(255, 75, 75, 0.2); border-color: #FF4B4B; color: #FF4B4B; }
    </style>
</head>
<body>

    <!-- 1. ONBOARDING -->
    <div id="onboarding">
        <h1>Willkommen bei CodeLingo!</h1>
        <p>Wie sollen wir dich nennen?</p>
        <input type="text" id="username-input" placeholder="Dein Name..." maxlength="15">
        
        <p style="margin-top: 10px;">Was möchtest du lernen?</p>
        <div class="course-card" onclick="startApp('spanisch')">
            <div class="flag">🇪🇸</div><div class="title">Spanisch</div>
        </div>
        <div class="course-card" onclick="startApp('lua')">
            <div class="flag">🌙</div><div class="title">Lua Programmierung</div>
        </div>
        <div class="course-card" onclick="startApp('python')">
            <div class="flag">🐍</div><div class="title">Python</div>
        </div>
    </div>

    <!-- 2. HAUPT-APP -->
    <div class="app-container" id="main-app">
        
        <div class="top-bar">
            <button class="course-switcher-btn" onclick="switchCourse()">
                <span id="current-course-flag">🇪🇸</span>
                <span>Wechseln</span>
            </button>
            <div class="stat streak">🔥 <span id="streak-val">4</span></div>
            <div class="stat gems">💎 <span id="gems-val">717</span></div>
        </div>

        <div class="content-area">
            <!-- VIEW 1: PFAD -->
            <div class="view active" id="view-path">
                <div class="path-container" id="path-container"></div>
            </div>

            <!-- VIEW 2: FREUNDE -->
            <div class="view" id="view-friends">
                <div class="friends-header">
                    <h2>Freunde finden</h2>
                    <p>Lerne zusammen mit anderen aus der Community.</p>
                </div>
                <div id="friends-list">
                    <!-- Wird per JS geladen -->
                </div>
            </div>

            <!-- VIEW 3: PROFIL -->
            <div class="view" id="view-profile">
                <div class="profile-card">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-name" id="profile-name-display">Lernender</div>
                    <div class="profile-stats">
                        <div class="p-stat"><span id="profile-streak">4</span><label>Tage Streak</label></div>
                        <div class="p-stat"><span id="profile-friends">0</span><label>Freunde</label></div>
                    </div>
                </div>
                <button class="add-btn" style="background-color: #FF4B4B; border-bottom-color: #CC0000; width: 100%; padding: 15px;" onclick="resetApp()">Account zurücksetzen</button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" id="nav-home" onclick="changeView('path', 'nav-home')">🏠</div>
            <div class="nav-item" id="nav-friends" onclick="changeView('friends', 'nav-friends')">👥</div>
            <div class="nav-item" id="nav-league" onclick="alert('Liga kommt bald!')">🛡️</div>
            <div class="nav-item" id="nav-profile" onclick="changeView('profile', 'nav-profile')">👤</div>
        </div>

        <!-- Quiz Modal -->
        <div id="quiz-modal">
            <div class="quiz-header">
                <button class="close-btn" onclick="closeQuiz()">✖</button>
                <div style="color: #58CC02; font-weight: 900; font-size: 20px;">❤️ ❤️ ❤️ ❤️ ❤️</div>
                <div style="width: 24px;"></div>
            </div>
            <div class="quiz-question" id="quiz-question-text">Frage lädt...</div>
            <div class="quiz-options" id="quiz-options-container"></div>
        </div>
    </div>

    <script>
        // --- DATEN ---
        const courseData = {
            'spanisch': { flag: '🇪🇸', questions: [{ q: 'Wie sagt man "Hallo"?', a: ['Hola', 'Ciao'], correct: 0 }]},
            'lua': { flag: '🌙', questions: [{ q: 'Wie gibt man Text aus?', a: ['print()', 'echo'], correct: 0 }]},
            'python': { flag: '🐍', questions: [{ q: 'Wie gibt man Text aus?', a: ['print()', 'console.log()'], correct: 0 }]}
        };

        // Simulierte echte Nutzer
        const communityUsers = [
            { id: 1, name: 'MaxMustermann', xp: 1250, avatar: '🦊' },
            { id: 2, name: 'LernLise', xp: 840, avatar: '🐼' },
            { id: 3, name: 'CodeCrafter', xp: 2300, avatar: '🦉' },
            { id: 4, name: 'PythonPaul', xp: 450, avatar: '🐍' }
        ];

        let activeCourse = null;
        let userName = 'Lernender';
        let progress = { 'spanisch': 0, 'lua': 0, 'python': 0 };

        // --- SICHERES LADEN (Verhindert Abstürze durch alte Daten) ---
        try {
            let savedName = localStorage.getItem('lingoName');
            if (savedName) userName = savedName;

            let savedProgress = localStorage.getItem('lingoProgress');
            if (savedProgress) {
                let parsed = JSON.parse(savedProgress);
                if(parsed && typeof parsed === 'object') progress = parsed;
            }

            let savedCourse = localStorage.getItem('activeCourse');
            if (savedCourse && courseData[savedCourse]) {
                activeCourse = savedCourse;
            }
        } catch (e) {
            console.log("Alte Daten gefunden, werden ignoriert.");
        }

        // --- INITIALISIERUNG ---
        window.onload = function() {
            if (activeCourse) {
                enterApp();
            } else {
                document.getElementById('onboarding').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        }

        function startApp(courseId) {
            const nameInput = document.getElementById('username-input').value.trim();
            if (nameInput === '') {
                alert('Bitte gib zuerst deinen Namen ein!');
                return;
            }
            userName = nameInput;
            localStorage.setItem('lingoName', userName);
            
            activeCourse = courseId;
            localStorage.setItem('activeCourse', courseId);
            enterApp();
        }

        function enterApp() {
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('profile-name-display').innerText = userName;
            document.getElementById('profile-streak').innerText = document.getElementById('streak-val').innerText;
            renderPath();
            renderFriends();
        }

        function resetApp() {
            if(confirm("Willst du wirklich deinen gesamten Fortschritt löschen?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- NAVIGATION ---
        function changeView(viewName, navId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('view-' + viewName).classList.add('active');
            document.getElementById(navId).classList.add('active');
        }

        // --- PFAD RENDERN ---
        function renderPath() {
            document.getElementById('current-course-flag').innerText = courseData[activeCourse].flag;
            const container = document.getElementById('path-container');
            container.innerHTML = ''; 
            const currentProgress = progress[activeCourse] || 0;

            for (let i = 1; i <= 6; i++) {
                let isCompleted = i <= currentProgress;
                let isActive = i === currentProgress + 1;
                let nodeClass = isCompleted ? '' : (isActive ? '' : 'locked');
                let nodeIcon = isCompleted ? '⭐' : (isActive ? '📖' : '🔒');
                let tooltipHTML = isActive ? `<div class="tooltip">HIER STARTEN</div>` : '';
                let onClick = isActive ? `onclick="openQuiz(${i})"` : '';

                container.innerHTML += `
                    <div class="node-wrapper">
                        ${tooltipHTML}
                        <button class="node ${nodeClass}" ${onClick}>${nodeIcon}</button>
                    </div>
                `;
            }
        }

        // --- FREUNDE RENDERN ---
        function renderFriends() {
            const list = document.getElementById('friends-list');
            list.innerHTML = '';
            let followedCount = 0;

            communityUsers.forEach(user => {
                let isFollowed = false;
                try {
                    isFollowed = localStorage.getItem('followed_' + user.id) === 'true';
                } catch(e) {}
                
                if(isFollowed) followedCount++;

                list.innerHTML += `
                    <div class="user-card">
                        <div class="user-info">
                            <div class="avatar">${user.avatar}</div>
                            <div>
                                <div class="user-name">${user.name}</div>
                                <div class="user-xp">💎 ${user.xp} XP</div>
                            </div>
                        </div>
                        <button class="add-btn ${isFollowed ? 'added' : ''}" onclick="toggleFollow(${user.id})">
                            ${isFollowed ? 'Gefolgt' : 'Folgen'}
                        </button>
                    </div>
                `;
            });

            document.getElementById('profile-friends').innerText = followedCount;
        }

        function toggleFollow(userId) {
            try {
                let isFollowed = localStorage.getItem('followed_' + userId) === 'true';
                if (isFollowed) {
                    localStorage.setItem('followed_' + userId, 'false');
                } else {
                    localStorage.setItem('followed_' + userId, 'true');
                }
            } catch(e) {}
            renderFriends();
        }

        // --- QUIZ LOGIK ---
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let currentTargetNode = 0;

        function openQuiz(nodeIndex) {
            currentTargetNode = nodeIndex;
            currentQuestions = courseData[activeCourse].questions;
            currentQuestionIndex = 0;
            document.getElementById('quiz-modal').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                completeLesson();
                return;
            }
            let qData = currentQuestions[currentQuestionIndex];
            document.getElementById('quiz-question-text').innerText = qData.q;
            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            qData.a.forEach((optionText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, index === qData.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 800);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => {
                    allBtns.forEach(b => { b.classList.remove('wrong'); b.disabled = false; });
                }, 800);
            }
        }

        function completeLesson() {
            closeQuiz();
            progress[activeCourse] = currentTargetNode;
            try {
                localStorage.setItem('lingoProgress', JSON.stringify(progress));
            } catch(e) {}
            renderPath();
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').style.display = 'none';
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
        }

        function switchCourse() {
            document.getElementById('onboarding').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('username-input').value = userName;
        }
    </script>
</body>
</html>
